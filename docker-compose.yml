version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: career_bot_dev_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_bot_dev
    ports:
      - "5432:5432"
    volumes:
      - career_bot_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_bot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  career_bot_dev_data: